[project]
name = "transaction-reconcile"
version = "0.1.0"
description = "Multi-Source Reconciliation Agent for Razorpay AI Buildathon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "faker>=20.0.0",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.2",
    "rapidfuzz>=3.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.0",
    "pyvis>=0.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
